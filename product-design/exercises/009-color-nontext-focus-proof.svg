<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><rect width="1500" height="980" fill="#f5f3ee"/><style>.t{font:700 28px Arial,sans-serif;fill:#161616}.h{font:700 18px Arial,sans-serif;fill:#161616}.b{font:400 15px Arial,sans-serif;fill:#333}.s{font:400 12px Arial,sans-serif;fill:#555}.panel{fill:#fff;stroke:#bbb}.focus{fill:none;stroke:#005fcc;stroke-width:3}.weak{fill:none;stroke:#b8c7d8;stroke-width:2}.rule{stroke:#777;stroke-width:1}</style><text x="60" y="52" class="t">Exercise 009 — Non-text Contrast + Focus Geometry</text><text x="60" y="82" class="b">Measured component-state examples derived from WCAG 2.2 non-text contrast and focus appearance criteria.</text><text x="60" y="130" class="h">A — selected operational row: robust redundant state</text><rect x="60" y="155" width="620" height="180" class="panel"/><rect x="82" y="180" width="576" height="105" rx="4" fill="#fff" stroke="#595959" stroke-width="2"/><rect x="98" y="198" width="8" height="68" fill="#111"/><text x="125" y="220" class="b">TOKYO / 14:20</text><text x="125" y="254" class="b">GATE 12 · BOARDING</text><text x="520" y="238" class="b">SELECTED</text><text x="82" y="312" class="s">Boundary #595959 on white ≈ 7.0:1; state also uses marker + word, so hue is not required.</text><text x="760" y="130" class="h">B — focus indicator: measured geometry</text><rect x="760" y="155" width="620" height="180" class="panel"/><rect x="850" y="205" width="300" height="70" rx="6" fill="#fff" stroke="#777" stroke-width="1"/><rect x="846" y="201" width="308" height="78" rx="9" class="focus"/><text x="910" y="247" class="b">Review transactions</text><text x="785" y="312" class="s">3 px external ring; #005FCC on white ≈ 6.23:1. Area exceeds a 2 CSS-pixel perimeter equivalent.</text><text x="60" y="400" class="h">C — weak state control: reject</text><rect x="60" y="425" width="620" height="180" class="panel"/><rect x="130" y="475" width="430" height="80" rx="4" fill="#fff" class="weak"/><text x="180" y="523" class="b">Selected only by pale outline</text><text x="82" y="582" class="s">REJECT: pale outline is visually fragile and carries selection alone; no text/shape redundancy.</text><text x="760" y="400" class="h">D — grayscale/state-removal critique</text><rect x="760" y="425" width="620" height="180" class="panel"/><rect x="790" y="455" width="560" height="50" fill="#fff" stroke="#595959"/><text x="810" y="486" class="b">BOARDING  ▶</text><rect x="790" y="525" width="560" height="50" fill="#fff" stroke="#595959"/><text x="810" y="556" class="b">DELAYED  !</text><text x="785" y="582" class="s">Status remains distinguishable without hue because labels and shapes carry the meaning.</text><text x="60" y="670" class="h">E — environmental stress interpretation</text><line x1="60" y1="692" x2="1380" y2="692" class="rule"/><text x="60" y="730" class="b">Bright/glare stress: subtle interior fills are assumed to wash out first. Required boundaries, labels, and marker geometry remain.</text><text x="60" y="765" class="b">Low-light stress: focus/state is not encoded by large luminous color fields; local contrast and geometry carry the signal.</text><text x="60" y="820" class="h">KEEP</text><text x="125" y="820" class="b">measured boundary contrast + redundant state semantics + scarce focus emphasis.</text><text x="60" y="855" class="h">REWORK</text><text x="150" y="855" class="b">actual device inspection under controlled bright/low-light conditions.</text><text x="60" y="890" class="h">REJECT</text><text x="135" y="890" class="b">color-only state, low-contrast required boundaries, focus indicators that disappear into component edges.</text></svg>