<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <rect width="1800" height="1180" fill="#f4f1ea"/>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#151515}.sub{font:400 17px Arial,sans-serif;fill:#444}.h{font:700 17px Arial,sans-serif;fill:#171717}.body{font:400 14px Arial,sans-serif;fill:#444}.big{font:700 52px Arial,sans-serif;fill:#151515}.mid{font:700 25px Arial,sans-serif;fill:#1c1c1c}.small{font:400 12px Arial,sans-serif;fill:#5c5c5c}.grid{stroke:#c8c3b8;stroke-width:1;stroke-dasharray:4 5}.rule{stroke:#7c786f;stroke-width:1}.heavy{stroke:#1c1c1c;stroke-width:2}.panel{fill:#fbfaf6;stroke:#d7d2c8;stroke-width:1}.accent{fill:#1c1c1c}.ghost{fill:#e7e2d8}.note{font:400 13px Arial,sans-serif;fill:#555}
  </style>
  <text x="70" y="58" class="title">Exercise 003 — Grid / Composition Comparison</text>
  <text x="70" y="88" class="sub">Same information. Three structural hypotheses. The exercise tests hierarchy, alignment, rhythm, and intentional grid breaking — not a product style.</text>

  <!-- panel frames -->
  <rect x="70" y="135" width="510" height="825" class="panel"/>
  <rect x="645" y="135" width="510" height="825" class="panel"/>
  <rect x="1220" y="135" width="510" height="825" class="panel"/>

  <!-- A grid -->
  <text x="90" y="170" class="h">A — symmetric modular grid</text>
  <text x="90" y="194" class="small">Hypothesis: parity and repeatability improve scan consistency.</text>
  <line x1="105" y1="220" x2="105" y2="920" class="grid"/><line x1="220" y1="220" x2="220" y2="920" class="grid"/><line x1="335" y1="220" x2="335" y2="920" class="grid"/><line x1="450" y1="220" x2="450" y2="920" class="grid"/><line x1="565" y1="220" x2="565" y2="920" class="grid"/>
  <line x1="105" y1="260" x2="565" y2="260" class="grid"/><line x1="105" y1="350" x2="565" y2="350" class="grid"/><line x1="105" y1="455" x2="565" y2="455" class="grid"/><line x1="105" y1="590" x2="565" y2="590" class="grid"/><line x1="105" y1="725" x2="565" y2="725" class="grid"/>
  <text x="105" y="245" class="body">ARCHIVE / CURRENT PERIOD</text>
  <text x="105" y="330" class="big">12,480</text>
  <text x="105" y="382" class="small">TOTAL RECORDS</text>
  <text x="105" y="430" class="mid">428</text><text x="220" y="430" class="mid">31</text><text x="335" y="430" class="mid">07</text><text x="450" y="430" class="mid">94%</text>
  <text x="105" y="448" class="small">THIS YEAR</text><text x="220" y="448" class="small">THIS MONTH</text><text x="335" y="448" class="small">PENDING</text><text x="450" y="448" class="small">COMPLETE</text>
  <line x1="105" y1="505" x2="565" y2="505" class="rule"/>
  <text x="105" y="535" class="h">LATEST</text>
  <text x="105" y="575" class="body">08 AUG 2026</text><text x="335" y="575" class="body">REFERENCE 703</text>
  <text x="105" y="625" class="mid">SEOUL → TOKYO</text>
  <text x="105" y="670" class="body">DURATION  1+25</text>
  <line x1="105" y1="705" x2="565" y2="705" class="rule"/>
  <text x="105" y="755" class="h">RECENT INDEX</text>
  <text x="105" y="792" class="body">01   08 AUG   1+25</text>
  <text x="105" y="824" class="body">02   07 AUG   2+10</text>
  <text x="105" y="856" class="body">03   05 AUG   0+55</text>
  <text x="105" y="912" class="note">Critique cue: equal modules are tidy, but support facts compete with the primary total.</text>

  <!-- B grid -->
  <text x="665" y="170" class="h">B — asymmetric hierarchy on shared datums</text>
  <text x="665" y="194" class="small">Hypothesis: hierarchy improves when shared alignments remain but importance is unequal.</text>
  <line x1="690" y1="220" x2="690" y2="920" class="grid"/><line x1="850" y1="220" x2="850" y2="920" class="grid"/><line x1="1040" y1="220" x2="1040" y2="920" class="grid"/><line x1="1130" y1="220" x2="1130" y2="920" class="grid"/>
  <text x="690" y="248" class="body">ARCHIVE / CURRENT PERIOD</text>
  <text x="690" y="350" class="big">12,480</text>
  <text x="692" y="380" class="small">TOTAL RECORDS</text>
  <line x1="690" y1="415" x2="1130" y2="415" class="heavy"/>
  <text x="690" y="458" class="mid">428</text><text x="850" y="458" class="mid">31</text><text x="1040" y="458" class="mid">07</text>
  <text x="690" y="479" class="small">THIS YEAR</text><text x="850" y="479" class="small">THIS MONTH</text><text x="1040" y="479" class="small">PENDING</text>
  <text x="690" y="552" class="h">LATEST</text>
  <text x="690" y="598" class="mid">SEOUL → TOKYO</text>
  <text x="690" y="627" class="body">08 AUG 2026 · REFERENCE 703</text>
  <text x="1040" y="598" class="mid">1+25</text>
  <line x1="690" y1="666" x2="1130" y2="666" class="rule"/>
  <text x="690" y="708" class="h">RECENT INDEX</text>
  <text x="690" y="750" class="body">01</text><text x="735" y="750" class="body">08 AUG</text><text x="850" y="750" class="body">REFERENCE 703</text><text x="1070" y="750" class="body">1+25</text>
  <text x="690" y="786" class="body">02</text><text x="735" y="786" class="body">07 AUG</text><text x="850" y="786" class="body">REFERENCE 558</text><text x="1070" y="786" class="body">2+10</text>
  <text x="690" y="822" class="body">03</text><text x="735" y="822" class="body">05 AUG</text><text x="850" y="822" class="body">REFERENCE 112</text><text x="1070" y="822" class="body">0+55</text>
  <text x="690" y="912" class="note">Critique cue: alignment remains strict while scale and span carry hierarchy.</text>

  <!-- C grid -->
  <text x="1240" y="170" class="h">C — controlled grid break</text>
  <text x="1240" y="194" class="small">Hypothesis: one element may escape the module if the break creates a meaningful dominant read.</text>
  <line x1="1260" y1="220" x2="1260" y2="920" class="grid"/><line x1="1400" y1="220" x2="1400" y2="920" class="grid"/><line x1="1540" y1="220" x2="1540" y2="920" class="grid"/><line x1="1680" y1="220" x2="1680" y2="920" class="grid"/>
  <text x="1260" y="247" class="body">ARCHIVE / CURRENT PERIOD</text>
  <rect x="1240" y="285" width="470" height="155" class="ghost"/>
  <text x="1260" y="380" class="big">12,480</text>
  <text x="1262" y="410" class="small">TOTAL RECORDS — intentionally spans the module</text>
  <line x1="1260" y1="475" x2="1680" y2="475" class="heavy"/>
  <text x="1260" y="520" class="mid">LATEST</text>
  <text x="1260" y="577" class="mid">SEOUL → TOKYO</text>
  <text x="1260" y="608" class="body">08 AUG 2026 · REFERENCE 703</text>
  <text x="1600" y="577" class="mid">1+25</text>
  <text x="1260" y="690" class="body">428 THIS YEAR</text><text x="1460" y="690" class="body">31 THIS MONTH</text><text x="1610" y="690" class="body">07 PENDING</text>
  <line x1="1260" y1="730" x2="1680" y2="730" class="rule"/>
  <text x="1260" y="772" class="h">RECENT</text>
  <text x="1260" y="814" class="body">08 AUG   REFERENCE 703</text><text x="1625" y="814" class="body">1+25</text>
  <text x="1260" y="850" class="body">07 AUG   REFERENCE 558</text><text x="1625" y="850" class="body">2+10</text>
  <text x="1260" y="912" class="note">Critique cue: the break is useful only because the rest of the layout preserves stable datums.</text>

  <!-- footer -->
  <line x1="70" y1="1005" x2="1730" y2="1005" class="rule"/>
  <text x="70" y="1045" class="h">Reading-order review</text>
  <text x="70" y="1077" class="body">A: title → total → four equal facts → latest → index. Risk: secondary facts gain too much parity.</text>
  <text x="70" y="1105" class="body">B: title → dominant total → support facts → latest → index. Strongest hierarchy without abandoning the system.</text>
  <text x="70" y="1133" class="body">C: dominant total interrupts the module, then returns to shared datums. Keep only if the interruption improves comprehension at narrow sizes.</text>
</svg>