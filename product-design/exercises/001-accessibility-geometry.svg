<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180">
  <rect width="1680" height="1180" fill="#f3f2ee"/>
  <style>
    .t{font:700 28px Arial,sans-serif;fill:#171717}.h{font:700 16px Arial,sans-serif;fill:#171717}.b{font:400 15px Arial,sans-serif;fill:#333}.s{font:400 12px Arial,sans-serif;fill:#555}.panel{fill:#fff;stroke:#c9c6bd;stroke-width:1}.rule{stroke:#bbb7ae;stroke-width:1}.target{fill:none;stroke:#1f6a8a;stroke-width:2;stroke-dasharray:5 4}.focus{fill:none;stroke:#8b2fb0;stroke-width:3}.danger{fill:#2a2a2a}.ghost{fill:#eceae4}.data{font:700 16px 'Courier New',monospace;fill:#171717}.muted{fill:#6a6862}
  </style>
  <text x="60" y="55" class="t">Exercise 001 — Accessibility Geometry Is Composition</text>
  <text x="60" y="82" class="b">Foundation specimen: reflow, hit envelopes, focus visibility, and a non-drag reorder path.</text>

  <!-- wide composition -->
  <text x="60" y="130" class="h">A — Wide composition / visible mark ≠ target</text>
  <rect x="60" y="150" width="920" height="340" rx="4" class="panel"/>
  <text x="90" y="188" class="h">Project archive</text>
  <text x="90" y="220" class="b">One primary object, supporting metadata, and restrained actions.</text>
  <line x1="90" y1="245" x2="950" y2="245" class="rule"/>
  <text x="90" y="285" class="data">Atlas / Research system</text>
  <text x="90" y="317" class="b">Updated today · 12 studies · 4 unresolved critiques</text>
  <!-- visually small icon, larger target -->
  <rect x="826" y="267" width="44" height="44" class="target"/><text x="842" y="295" class="h">⋮</text>
  <rect x="890" y="267" width="60" height="44" class="target"/><text x="902" y="295" class="h">OPEN</text>
  <text x="805" y="338" class="s">blue dashed = actual target envelope</text>
  <line x1="90" y1="355" x2="950" y2="355" class="rule"/>
  <text x="90" y="390" class="h">Next review</text><text x="220" y="390" class="b">Curve continuity · focus order · narrow layout</text>
  <text x="90" y="440" class="s">The UI looks compact because the visible marks are quiet, not because the hit regions are undersized.</text>

  <!-- narrow composition -->
  <text x="1040" y="130" class="h">B — 320-equivalent narrow reflow</text>
  <rect x="1040" y="150" width="360" height="520" rx="4" class="panel"/>
  <text x="1068" y="188" class="h">Project archive</text>
  <text x="1068" y="218" class="b">One primary object, supporting</text><text x="1068" y="240" class="b">metadata, and restrained actions.</text>
  <line x1="1068" y1="264" x2="1372" y2="264" class="rule"/>
  <text x="1068" y="302" class="data">Atlas / Research</text>
  <text x="1068" y="328" class="data">system</text>
  <text x="1068" y="366" class="b">Updated today · 12 studies</text><text x="1068" y="388" class="b">4 unresolved critiques</text>
  <rect x="1068" y="414" width="136" height="48" class="target"/><text x="1113" y="444" class="h">OPEN</text>
  <rect x="1220" y="414" width="48" height="48" class="target"/><text x="1238" y="444" class="h">⋮</text>
  <line x1="1068" y1="490" x2="1372" y2="490" class="rule"/>
  <text x="1068" y="526" class="h">Next review</text>
  <text x="1068" y="554" class="b">Curve continuity</text><text x="1068" y="578" class="b">Focus order</text><text x="1068" y="602" class="b">Narrow layout</text>
  <text x="1068" y="640" class="s">Hierarchy preserved; layout changed.</text>

  <!-- focus states -->
  <text x="60" y="555" class="h">C — Focus must survive sticky and overlay layers</text>
  <rect x="60" y="575" width="760" height="260" class="panel"/>
  <rect x="60" y="575" width="760" height="52" class="ghost"/>
  <text x="82" y="608" class="h">Sticky header</text>
  <rect x="90" y="654" width="250" height="52" class="focus"/><text x="108" y="686" class="b">Focused row action</text>
  <rect x="90" y="728" width="250" height="52" class="panel"/><text x="108" y="760" class="b">Next action</text>
  <rect x="430" y="640" width="330" height="155" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="452" y="674" class="h">Overlay</text><text x="452" y="704" class="b">Does not cover the focused</text><text x="452" y="726" class="b">control or its focus ring.</text>
  <text x="90" y="816" class="s">Purple ring is intentionally structural and visible, not a hidden browser artifact.</text>

  <!-- drag alternative -->
  <text x="880" y="735" class="h">D — Reorder: drag + explicit alternative</text>
  <rect x="880" y="755" width="520" height="310" class="panel"/>
  <text x="906" y="792" class="b">Visible fields</text>
  <line x1="906" y1="810" x2="1374" y2="810" class="rule"/>
  <g>
    <rect x="906" y="830" width="468" height="54" class="ghost"/><text x="922" y="863" class="b">01  Date</text><text x="1258" y="863" class="b">↑  ↓  ☰</text>
    <rect x="906" y="892" width="468" height="54" class="ghost"/><text x="922" y="925" class="b">02  Route</text><text x="1258" y="925" class="b">↑  ↓  ☰</text>
    <rect x="906" y="954" width="468" height="54" class="ghost"/><text x="922" y="987" class="b">03  Duration</text><text x="1258" y="987" class="b">↑  ↓  ☰</text>
  </g>
  <rect x="1238" y="834" width="44" height="44" class="target"/><rect x="1286" y="834" width="44" height="44" class="target"/><rect x="1334" y="834" width="40" height="44" class="target"/>
  <text x="906" y="1040" class="s">Drag handle remains available, but Move Up / Move Down can achieve the same ordering result.</text>

  <!-- explicit exception -->
  <text x="60" y="900" class="h">E — Two-dimensional exception must be justified, not habitual</text>
  <rect x="60" y="920" width="760" height="180" class="panel"/>
  <text x="84" y="954" class="b">Dense table viewport → controlled horizontal scroll retained because column relationships are semantic.</text>
  <text x="84" y="992" class="data">DATE      DEP   ARR   VALUE   STATUS</text>
  <text x="84" y="1022" class="data">14 SEP    RKSI  RJTT  1+25    REVIEW</text>
  <text x="84" y="1052" class="data">15 SEP    RJTT  RKSI  1+30    READY</text>
  <text x="84" y="1083" class="s">Cell text itself remains readable; the exception belongs to the table relationship, not every surrounding control.</text>
</svg>
