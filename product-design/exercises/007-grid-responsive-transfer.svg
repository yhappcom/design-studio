<line x1="90" y1="165" x2="90" y2="550" class="g"/><line x1="260" y1="165" x2="260" y2="550" class="g"/><line x1="470" y1="165" x2="470" y2="550" class="g"/><line x1="715" y1="165" x2="715" y2="550" class="g"/>
