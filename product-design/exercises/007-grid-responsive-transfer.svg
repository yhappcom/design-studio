<line x1="90" y1="315" x2="715" y2="315" class="r"/><text x="90" y="355" class="m">428</text><text x="260" y="355" class="m">31</text><text x="470" y="355" class="m">07</text>
<text x="90" y="375" class="s">THIS YEAR</text><text x="260" y="375" class="s">THIS MONTH</text><text x="470" y="375" class="s">PENDING</text>
