<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W024 state matrix</title><style>
:root{font:16px/1.45 system-ui,sans-serif;color:#17212B;background:#fff;--ok:#165C36;--okbg:#EAF7EF;--fail:#8B1E1E;--failbg:#FFF0F0;--unknown:#704C00;--unknownbg:#FFF6D8;--offline:#44515E;--offlinebg:#EEF2F5;--pending:#314A72;--pendingbg:#EEF4FF;--conflict:#6D2E7A;--conflictbg:#FAEEFF}*{box-sizing:border-box}body{margin:0}.shell{max-width:52rem;margin:auto;padding:1rem}.literal{unicode-bidi:isolate;direction:ltr}.state{padding:.75rem;border:2px solid currentColor;border-radius:.5rem;margin-block:1rem}.pending{color:var(--pending);background:var(--pendingbg)}.confirmed{color:var(--ok);background:var(--okbg)}.failure{color:var(--fail);background:var(--failbg)}.unknown{color:var(--unknown);background:var(--unknownbg)}.offline{color:var(--offline);background:var(--offlinebg)}.conflict{color:var(--conflict);background:var(--conflictbg)}.controls,.actions{display:flex;gap:.5rem;flex-wrap:wrap}button{min-width:24px;min-height:24px}button:focus-visible{outline:3px solid #005FCC;outline-offset:3px}.sticky{position:sticky;bottom:0;background:inherit;padding:.75rem 0}@media(max-width:560px){.shell{padding:.75rem}.controls button{flex:1 1 7rem}}@media(prefers-color-scheme:dark){:root{color:#F2F5F7;background:#101418;--ok:#A8E6BF;--okbg:#173023;--fail:#FFB4AB;--failbg:#3A1717;--unknown:#FFD966;--unknownbg:#332700;--offline:#D0D7DE;--offlinebg:#252B31;--pending:#B8D4FF;--pendingbg:#17263C;--conflict:#F0B8FF;--conflictbg:#321A38}button{color:inherit;background:#252B31;border:1px solid #89939d}button:focus-visible{outline-color:#8CC8FF}}@media(forced-colors:active){.state{forced-color-adjust:auto;color:CanvasText;background:Canvas;border-color:CanvasText}button:focus-visible{outline:3px solid Highlight}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style><body><main class="shell"><h1>Record <span class="literal">KE123</span></h1><p><span class="literal">ICN</span> → <span class="literal">NRT</span> · <span class="literal">01:35</span></p><div class="controls" aria-label="State fixtures"><button data-s="pending">Pending</button><button data-s="confirmed">Confirmed</button><button data-s="failure">Failure</button><button data-s="unknown">Unknown</button><button data-s="offline">Offline</button><button data-s="conflict">Conflict</button></div><div id="state" class="state unknown" role="status" aria-live="polite"></div><div id="actions" class="actions"></div><div class="sticky"><button id="edit">Edit record</button></div></main><script>const fixtures={pending:['Saving record','Keep this screen open while the save finishes.',[]],confirmed:['Record confirmed','The saved record matches this device.',[['Edit record','edit']]],failure:['Save failed','The record was not saved. Fix the connection or try again.',[['Try again','retry']]],unknown:['Save status unknown','We could not confirm whether this record was saved. Check the record before trying again.',[['Check record','check']]],offline:['Offline — record not synced','This device has the record, but sync cannot continue until a connection is available.',[['View local record','local']]],conflict:['Record conflict','This device and the other copy contain different changes. Compare both before choosing which version to keep.',[['Compare versions','compare']]]};const state=document.querySelector('#state'),actions=document.querySelector('#actions');function setState(k){const[h,p,aa]=fixtures[k];state.className='state '+k;state.dataset.semanticState=k;state.innerHTML='<strong>'+h+'</strong><p>'+p+'</p>';actions.innerHTML=aa.map(([t,a])=>'<button data-action="'+a+'">'+t+'</button>').join('')}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setState(b.dataset.s));setState('unknown');</script></body></html>
