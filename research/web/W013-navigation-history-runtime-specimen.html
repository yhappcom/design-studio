<!doctype html><meta charset="utf-8"><title>W013 history transfer</title>
<style>body{font:16px system-ui;margin:0}nav{padding:12px;border-bottom:1px solid}main{padding:24px;min-height:1600px}a,button{margin:4px;padding:8px}.current{font-weight:700;text-decoration:underline}</style>
<nav aria-label="Primary"><a href="/portfolios" data-route="/portfolios">Portfolios</a><a href="/portfolios/alpha" data-route="/portfolios/alpha">Alpha</a></nav>
<main><h1 id="heading" tabindex="-1"></h1><p id="context"></p><label>Period <select id="period"><option>1m</option><option>1y</option></select></label><button id="edit">Edit holding</button><dialog id="dialog"><h2>Edit holding</h2><button id="close">Close</button></dialog><div style="height:1200px"></div><button id="deep">Deep control</button></main>
<script>
const routes={'/portfolios':['Portfolios','Collection'],'/portfolios/alpha':['Portfolio Alpha','Portfolio context'],'/portfolios/alpha/holdings/CONY':['CONY','Holding in Portfolio Alpha']};
function canonical(){const r=decodeURIComponent(location.hash.slice(1).split('|')[0]||'');return routes[r]?r:'/portfolios'}
function render({focus=false}={}){const r=canonical(),[h,c]=routes[r];heading.textContent=h;context.textContent=c;document.title=h+' — W013';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('current',a.dataset.route===r));period.value=(location.hash.split('|')[1]||'1m');if(focus)heading.focus()}
function state(){return{route:canonical(),period:period.value,scrollY:scrollY}}
if(!history.state)history.replaceState(state(),'','#'+encodeURIComponent(canonical())+'|'+period.value);render();
document.addEventListener('click',e=>{const a=e.target.closest('[data-route]');if(a){e.preventDefault();history.replaceState({...state(),scrollY},'',location.href);history.pushState({route:a.dataset.route,period:'1m',scrollY:0},'','#'+encodeURIComponent(a.dataset.route)+'|1m');render({focus:true});scrollTo(0,0)}});
period.addEventListener('change',()=>history.replaceState({...state(),period:period.value},'','#'+encodeURIComponent(canonical())+'|'+period.value));
addEventListener('popstate',e=>{render({focus:true});requestAnimationFrame(()=>scrollTo(0,e.state?.scrollY||0))});
edit.addEventListener('click',()=>dialog.showModal());document.querySelector('#close').addEventListener('click',()=>{dialog.close();edit.focus()});
</script>
