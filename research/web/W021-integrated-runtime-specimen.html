<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W021 integrated specimen</title><style>
:root{font:16px/1.45 system-ui,sans-serif;color:#17212B;background:#fff;--action:#075E54;--ok:#165C36;--okbg:#EAF7EF;--fail:#8B1E1E;--failbg:#FFF0F0;--unknown:#704C00;--unknownbg:#FFF6D8;--offline:#44515E;--offlinebg:#EEF2F5}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:14rem minmax(14rem,22rem) minmax(0,1fr);min-height:100vh}.nav,.list,.detail{padding:1rem;border-inline-end:1px solid #ccd4da}.nav{position:sticky;top:0;height:100vh}.record{padding:.75rem;border:1px solid #ccd4da;border-radius:.5rem;margin-block:.5rem}.status{padding:.75rem;border:2px solid currentColor;border-radius:.5rem;margin-block:1rem}.confirmed{color:var(--ok);background:var(--okbg)}.failure{color:var(--fail);background:var(--failbg)}.unknown{color:var(--unknown);background:var(--unknownbg)}.offline{color:var(--offline);background:var(--offlinebg)}button,a{min-width:24px;min-height:24px}button:focus-visible,a:focus-visible{outline:3px solid #005FCC;outline-offset:3px}.actions{display:flex;gap:.75rem;flex-wrap:wrap}.literal{unicode-bidi:isolate;direction:ltr}.sticky{position:sticky;bottom:0;background:inherit;padding:.75rem 0}@media(max-width:850px){.shell{grid-template-columns:12rem minmax(0,1fr)}.list{display:none}}@media(max-width:560px){.shell{display:block}.nav{position:static;height:auto;border-bottom:1px solid #ccd4da}.detail{border:0}.list{display:block;border:0}.nav ul{display:flex;gap:1rem;list-style:none;padding:0;flex-wrap:wrap}}@media(prefers-color-scheme:dark){:root{color:#F2F5F7;background:#101418;--action:#9DE9DF;--ok:#A8E6BF;--okbg:#173023;--fail:#FFB4AB;--failbg:#3A1717;--unknown:#FFD966;--unknownbg:#332700;--offline:#D0D7DE;--offlinebg:#252B31}button{color:inherit;background:#252B31;border:1px solid #89939d}button:focus-visible,a:focus-visible{outline-color:#8CC8FF}}@media(forced-colors:active){.status{forced-color-adjust:auto;border:2px solid CanvasText}.confirmed,.failure,.unknown,.offline{color:CanvasText;background:Canvas}button:focus-visible,a:focus-visible{outline:3px solid Highlight}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style><body><main class="shell"><nav class="nav" aria-label="Primary"><strong>LogMate</strong><ul><li><a href="#records">Records</a></li><li><a href="#search">Search</a></li><li><a href="#settings">Settings</a></li></ul></nav><section class="list" id="records" aria-label="Flight records"><h1>Flight records</h1><article class="record"><b class="literal">KE123</b><div><span class="literal">ICN</span> → <span class="literal">NRT</span></div></article><article class="record"><b class="literal">B737-900</b><div>Registration <span class="literal">HL8240</span></div></article></section><section class="detail" aria-labelledby="detail-title"><h2 id="detail-title">Record <span class="literal">KE123</span></h2><p>12 Sep 2026 · <span class="literal">ICN</span> → <span class="literal">NRT</span></p><div id="state" class="status unknown" role="status" aria-live="polite"><strong>Save status unknown</strong><p>We could not confirm whether this record was saved. Check the record before trying again.</p></div><div class="actions"><button id="check">Check record</button><button id="save" disabled>Save again</button><button id="expand">Pseudo-expand</button><button id="rtl">RTL stress</button></div><div class="sticky"><button id="edit">Edit record</button></div></section></main><script>
const state=document.querySelector('#state');const save=document.querySelector('#save');document.querySelector('#check').onclick=()=>{state.className='status confirmed';state.innerHTML='<strong>Record confirmed</strong><p>The saved record matches this device.</p>';save.disabled=false};document.querySelector('#expand').onclick=()=>{state.innerHTML='<strong>Save status remains unknown after the verification request</strong><p>We still could not confirm whether this flight record was saved successfully. Review the current record details before choosing any action that could create a duplicate entry.</p>'};document.querySelector('#rtl').onclick=()=>{document.documentElement.dir='rtl';state.innerHTML='<strong>حالة الحفظ غير مؤكدة</strong><p>تحقق من السجل <b class="literal">KE123</b> والمسار <span class="literal">ICN</span> → <span class="literal">NRT</span> قبل المحاولة مرة أخرى.</p>'};
</script></body></html>
