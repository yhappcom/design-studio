<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W027 true-origin runtime harness</title><style>body{font:16px system-ui;max-width:48rem;margin:auto;padding:2rem}button,a,select,input{min-height:44px}.panel{border:1px solid;padding:1rem;margin-block:1rem}.sticky{position:sticky;bottom:0;background:Canvas;border:2px solid ButtonText;padding:.75rem}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid Highlight;outline-offset:3px}@media(max-width:24rem){body{padding:1rem}}</style><body><h1>W027 true-origin execution harness</h1><nav><a href="?route=start">Start</a> · <a href="?route=review">Review</a></nav><main><section class="panel" aria-live="polite"><h2 id="state">Ready</h2><p id="detail">No operation dispatched.</p><label>Controlled outcome <select id="mode"><option value="confirm">confirmed</option><option value="reject">known failure</option><option value="drop-before">transport drops before commit</option><option value="drop-after">transport drops after commit</option></select></label><p><button id="dispatch">Dispatch operation</button> <button id="reconcile">Check outcome</button></p></section><section class="panel"><label>Long localized specimen <input value="Your previous operation may have completed. Check the latest record before trying again."></label></section></main><div class="sticky">Authored sticky layer for focus/occlusion checks</div><script>const q=new URLSearchParams(location.search),state=document.querySelector('#state'),detail=document.querySelector('#detail'),mode=document.querySelector('#mode'),dispatch=document.querySelector('#dispatch'),reconcile=document.querySelector('#reconcile');history.replaceState({route:q.get('route')||'start'},'',location.href);addEventListener('popstate',()=>detail.textContent='history traversal: '+location.href);let op=0,lastId=null;dispatch.onclick=async()=>{lastId='op-'+(++op);state.textContent='Pending';detail.textContent=lastId+' dispatched';try{const r=await fetch('/w027/operation?id='+encodeURIComponent(lastId)+'&mode='+encodeURIComponent(mode.value),{method:'POST'});const j=await r.json();if(!r.ok){state.textContent='Known failure';detail.textContent=lastId+' '+JSON.stringify(j);return}state.textContent=j.state||'Confirmed';detail.textContent=lastId+' '+JSON.stringify(j)}catch(e){state.textContent='Outcome unknown';detail.textContent=lastId+' transport ended without authoritative commit evidence; reconcile before unsafe retry.'}};reconcile.onclick=async()=>{state.textContent='Checking outcome';try{const r=await fetch('/w027/status?id='+encodeURIComponent(lastId||''));const j=await r.json();state.textContent=j.state==='confirmed'?'Confirmed after reconciliation':j.state==='not-found'?'Not found after reconciliation':'Outcome unknown';detail.textContent=JSON.stringify(j)}catch(e){state.textContent='Outcome unknown';detail.textContent='reconciliation unavailable; outcome remains unknown'}}</script></body></html>
