<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W027 true-origin runtime harness</title><style>body{font:16px system-ui;max-width:48rem;margin:auto;padding:2rem}button,a{min-height:44px}.panel{border:1px solid;padding:1rem;margin-block:1rem}.sticky{position:sticky;bottom:0;background:Canvas;border:2px solid ButtonText;padding:.75rem}button:focus-visible,a:focus-visible{outline:3px solid Highlight;outline-offset:3px}@media(max-width:24rem){body{padding:1rem}}</style><body><h1>W027 true-origin execution harness</h1><nav><a href="?route=start" id="start">Start</a> · <a href="?route=review" id="review">Review</a></nav><main><section class="panel" aria-live="polite"><h2 id="state">Ready</h2><p id="detail">No operation dispatched.</p><button id="dispatch">Dispatch operation</button> <button id="reconcile">Check outcome</button></section><section class="panel"><label>Long localized specimen <input value="Your previous operation may have completed. Check the latest record before trying again."></label></section></main><div class="sticky">Authored sticky layer for focus/occlusion checks</div><script>const q=new URLSearchParams(location.search);history.replaceState({route:q.get('route')||'start'},'',location.href);addEventListener('popstate',()=>document.querySelector('#detail').textContent='history traversal: '+location.href);let op=0;dispatch.onclick=async()=>{const id='op-'+(++op);state.textContent='Pending';detail.textContent=id+' dispatched';try{const r=await fetch('/w027/operation?id='+encodeURIComponent(id),{method:'POST'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();state.textContent=j.state||'Confirmed';detail.textContent=id+' '+JSON.stringify(j)}catch(e){state.textContent='Outcome unknown';detail.textContent=id+' transport ended without authoritative commit evidence; reconcile before unsafe retry.'}};reconcile.onclick=async()=>{state.textContent='Checking outcome';try{const r=await fetch('/w027/status');detail.textContent='reconciliation HTTP '+r.status}catch(e){detail.textContent='reconciliation unavailable; outcome remains unknown'}};</script></body></html>
