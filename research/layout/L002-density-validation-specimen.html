<!doctype html><html lang="en"><meta charset="utf-8"><title>L002 Density Validation Specimen</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--fs:1;--row-pad:4px;--gap:6px;--section-gap:12px;--control-h:44px;--page-pad:16px;font-size:calc(16px * var(--fs));}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111}.app{padding:var(--page-pad);max-width:1180px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:center;margin-bottom:var(--section-gap)}button{min-height:var(--control-h);padding:6px 10px;font:inherit}.table{border:1px solid #aaa}.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,.8fr) minmax(76px,.55fr);gap:var(--gap);align-items:center;padding:var(--row-pad) 10px;border-bottom:1px solid #ddd}.row:last-child{border-bottom:0}.cell{min-width:0;overflow-wrap:anywhere}.header{font-weight:700;background:#f3f3f3}.meta{font-size:.875rem}.action{justify-self:end}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--section-gap)}.card{border:1px solid #bbb;padding:calc(var(--row-pad)*1.3 + 6px);min-width:0}
body[data-density="intermediate"]{--row-pad:8px;--gap:10px;--section-gap:20px;--page-pad:24px}body[data-density="spacious"]{--row-pad:14px;--gap:16px;--section-gap:32px;--page-pad:32px}
body[data-policy="naive"][data-density="compact"]{--row-pad:6px;--gap:6px;--section-gap:12px;--control-h:32px;--page-pad:16px}body[data-policy="naive"][data-density="intermediate"]{--row-pad:10px;--gap:10px;--section-gap:20px;--control-h:40px;--page-pad:24px}body[data-policy="naive"][data-density="spacious"]{--row-pad:16px;--gap:16px;--section-gap:32px;--control-h:44px;--page-pad:32px}body[data-policy="naive"] .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
@media(max-width:720px){
 body[data-policy="naive"] .row{grid-template-columns:1.5fr 1fr 80px}
 body[data-policy="naive"] .metric,body[data-policy="naive"] .change{display:none}
 body[data-policy="naive"] .summary{grid-template-columns:1fr}
 body:not([data-policy="naive"]) .summary{grid-template-columns:1fr}
 body:not([data-policy="naive"]) .row.header{display:none}
 body:not([data-policy="naive"]) .row.data-row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'name action' 'status status' 'metric change';align-items:start}
 body:not([data-policy="naive"]) .name{grid-area:name;font-weight:650}
 body:not([data-policy="naive"]) .status{grid-area:status}
 body:not([data-policy="naive"]) .metric{grid-area:metric}
 body:not([data-policy="naive"]) .change{grid-area:change;text-align:right}
 body:not([data-policy="naive"]) .action{grid-area:action;align-self:start}
 body:not([data-policy="naive"]) .status,body:not([data-policy="naive"]) .metric,body:not([data-policy="naive"]) .change{display:grid;grid-template-columns:auto 1fr;gap:6px}
 body:not([data-policy="naive"]) .status::before{content:'Status';font-size:.75em;font-weight:600}
 body:not([data-policy="naive"]) .metric::before{content:'Value';font-size:.75em;font-weight:600}
 body:not([data-policy="naive"]) .change::before{content:'Change';font-size:.75em;font-weight:600}
 body[data-policy="adaptive"][data-scale="2"][data-density="intermediate"]{--row-pad:6px;--gap:8px;--section-gap:16px;--page-pad:16px}
 body[data-policy="adaptive"][data-scale="2"][data-density="spacious"]{--row-pad:8px;--gap:10px;--section-gap:18px;--page-pad:18px}
 .app{max-width:none}
}
</style>
<body data-policy="adaptive" data-density="compact" data-scale="1"><main class="app"><div class="toolbar"><button>Filter</button><button>Sort</button><div class="meta">Portfolio comparison</div></div><section class="summary"><div class="card"><strong>Total value</strong><div>$128,442</div></div><div class="card"><strong>Monthly income</strong><div>$2,184</div></div><div class="card"><strong>Recovery</strong><div>38.4%</div></div></section><section class="table"><div class="row header"><div>Name</div><div>Status</div><div>Value</div><div>Change</div><div></div></div><div id="rows"></div></section></main>
<script>
const en=[['Alpha Income Portfolio','Active','$12,884','+3.8%'],['Global Yield Strategy','Review','$8,104','-1.2%'],['Long Duration Income Basket','Active','$18,220','+0.6%'],['Technology Enhanced Income','Active','$14,052','+2.4%'],['Monthly Distribution Core','Paused','$9,994','-0.4%'],['International Covered Call','Active','$11,242','+1.8%'],['High Volatility Income Sleeve','Review','$7,880','-3.1%'],['Retirement Income Stability','Active','$16,530','+0.2%'],['Tactical Opportunity Basket','Active','$10,402','+4.9%'],['Capital Recovery Monitor','Review','$6,884','-0.9%'],['Long-Term Reinvestment Plan','Active','$13,290','+1.1%'],['Tax Adjustment Watchlist','Active','$5,960','+0.1%']];
const ko=[['알파 월분배 인컴 포트폴리오 장기추적','운용 중','$12,884','+3.8%'],['글로벌 고배당 인컴 전략 검토대상','검토 필요','$8,104','-1.2%'],['장기 듀레이션 인컴 바스켓 비교대상','운용 중','$18,220','+0.6%'],['기술주 기반 커버드콜 인컴 포트폴리오','운용 중','$14,052','+2.4%'],['월분배 핵심 자산배분 포트폴리오','일시 중지','$9,994','-0.4%'],['국제 분산 커버드콜 수익전략 포트폴리오','운용 중','$11,242','+1.8%'],['고변동성 인컴 슬리브 위험점검 필요','검토 필요','$7,880','-3.1%'],['은퇴 현금흐름 안정성 중심 포트폴리오','운용 중','$16,530','+0.2%'],['전술적 기회 포착 자산 바스켓','운용 중','$10,402','+4.9%'],['원금회수율 집중 모니터링 포트폴리오','검토 필요','$6,884','-0.9%'],['장기 자동재투자 성과추적 포트폴리오','운용 중','$13,290','+1.1%'],['세금 정산 및 환급 추적 관심목록','운용 중','$5,960','+0.1%']];
let locale='en';function render(){rows.innerHTML=(locale==='ko'?ko:en).map((r,i)=>`<div class="row data-row" data-i="${i}"><div class="name cell">${r[0]}</div><div class="status cell">${r[1]}</div><div class="metric cell">${r[2]}</div><div class="change cell">${r[3]}</div><button class="action">Open</button></div>`).join('')}
window.setConfig=(policy,density,fs,loc)=>{document.body.dataset.policy=policy;document.body.dataset.density=density;document.body.dataset.scale=String(fs);document.documentElement.style.setProperty('--fs',fs);locale=loc;render()};render();
window.measure=()=>{const rs=[...document.querySelectorAll('.data-row')],vh=innerHeight;const cells=[...document.querySelectorAll('.data-row .cell')];const clipped=cells.filter(el=>getComputedStyle(el).display!=='none'&&el.scrollWidth>el.clientWidth+1&&getComputedStyle(el).overflowX==='hidden').length;const hiddenCritical=cells.filter(el=>getComputedStyle(el).display==='none').length;const wrapped=cells.filter(el=>{if(getComputedStyle(el).display==='none')return false;const cs=getComputedStyle(el);const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.2;return el.getBoundingClientRect().height>lh*1.45}).length;const btn=[...document.querySelectorAll('button')].map(b=>b.getBoundingClientRect().height);const heights=rs.map(r=>r.getBoundingClientRect().height);let best=0;for(let i=0;i<rs.length;i++){let sum=0,n=0;for(let j=i;j<rs.length;j++){sum+=heights[j];if(sum<=vh-24)n++;else break}best=Math.max(best,n)}return {scrollHeight:document.documentElement.scrollHeight,clientHeight:document.documentElement.clientHeight,scrollRatio:document.documentElement.scrollHeight/document.documentElement.clientHeight,clippedCount:clipped,hiddenCriticalCount:hiddenCritical,wrappedCellCount:wrapped,minButtonHeight:Math.min(...btn),maxRowHeight:Math.max(...heights),minRowHeight:Math.min(...heights),avgRowHeight:heights.reduce((a,b)=>a+b,0)/heights.length,horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,maxRowsPerViewport:best,tableHeight:document.querySelector('.table').getBoundingClientRect().height};};
</script></body></html>
