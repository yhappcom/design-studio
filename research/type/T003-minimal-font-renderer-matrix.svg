<text x="55" y="1755" class="h">Observed renderer interaction</text>
<text x="55" y="1787" class="s">At 14 ppem, autohint-normal suppresses the R0/R1 strong-pixel difference (15 → 15) even though no-hint shows 13 → 11.</text>
<text x="55" y="1815" class="s">At 24 ppem, autohint-normal produces 14px vs 13px hinted advances from identical 560-unit source advances; the standard integer delta correction still leaves repeated origins 14px vs 13px apart.</text>
<text x="55" y="1843" class="s">At 48 ppem, delta-aware integer positioning instead normalizes repeated origins to 27px for both. T002 compact fragility and spacing effects are therefore renderer- and size-dependent, not outline-only facts.</text>
