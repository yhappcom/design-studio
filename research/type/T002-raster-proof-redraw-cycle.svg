<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160">
<rect width="1280" height="1160" fill="#f4f2ec"/>
<style>.title{font:700 30px Arial,sans-serif;fill:#151515}.sub{font:400 16px Arial,sans-serif;fill:#454545}.size{font:700 20px Arial,sans-serif;fill:#222}.label{font:700 15px Arial,sans-serif;fill:#222}.metric{font:400 13px Arial,sans-serif;fill:#555}.note{font:400 14px Arial,sans-serif;fill:#444}.rule{stroke:#cbc7bd;stroke-width:1}</style>
<text x="55" y="52" class="title">T002 — Raster Surrogate Redraw Cycle</text>
<text x="55" y="82" class="sub">Exercise 002 lowercase n · R0 original dark-join hypothesis vs R1 join-relief redraw</text>
<text x="55" y="108" class="sub">Embedded PNGs are exact CairoSVG grayscale coverage samples. No font hinting, shaping, metrics, or OS text renderer.</text>
<line x1="55" y1="132" x2="1225" y2="132" class="rule"/>

    <text x="55" y="165" class="size">14px x-height-equivalent</text>
    <text x="55" y="194" class="metric">embedded raster: 14×16 px · grayscale coverage · no hinting</text>
    <text x="55" y="222" class="metric">shoulder run mean: 2.00px → 1.44px</text>
    <text x="55" y="248" class="metric">median: 2px → 1px · 9 sampled columns · threshold L&lt;128</text>
    <text x="360" y="165" class="label">R0 original</text>
    <image x="360" y="190" width="238" height="272" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAQCAAAAAAD/xHmAAAAi0lEQVR42oXPMQ4BYRCG4XeGeguRZRORaJxAJEoNEpVK4QgOwD3cYWu1M6j+kkhcQCS0+BS/ZHcrb/dkipkxUc6vk2XZgVRFdQDt81MyXrfi9D6rjeYd2keJQDodnKXXlt5TBJrZTZI+Q3ZyYNMAsBUHHFjEHX0uOFg3MuOBg/0uSCKL3lXyh1Z98AtHJC+hYv3a5wAAAABJRU5ErkJggg=="/>
    <text x="780" y="165" class="label">R1 join-relief redraw</text>
    <image x="780" y="190" width="238" height="272" image-rendering="pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAQCAAAAAAD/xHmAAAAhUlEQVR42mP8z4AMmB64hSPzLzGI/UcAJojgr2sP/sFlH8SIybNI9/75/5/hEoPYCeWlf/8/92aI+/+f4RKDqOKJ//////+uwLDmPxMDw39/cwYGBgaOFIZVDEwMDAzJEOP0Ga4zMDEwMOlAuDIMHxiYEC7gZ/iIzGVg+IvKZSDAZUT1IACUWDHmiQojgQAAAABJRU5ErkJggg=="/>
    
    <text x="55" y="455" class="size">24px x-height-equivalent</text>
    <text x="55" y="484" class="metric">embedded raster: 24×27 px · grayscale coverage · no hinting</text>
    <text x="55" y="512" class="metric">shoulder run mean: 3.22px → 2.22px</text>
    <text x="55" y="538" class="metric">median: 3px → 2px · 9 sampled columns · threshold L&lt;128</text>
    <text x="360" y="455" class="label">R0 original</text>
    <image x="360" y="480" width="240" height="270" image-rendering="pixelated" href="data:image/png;base64,"/>
    <text x="780" y="455" class="label">R1 join-relief redraw</text>
    <image x="780" y="480" width="240" height="270" image-rendering="pixelated" href="data:image/png;base64,"/>
    
    <text x="55" y="745" class="size">48px x-height-equivalent</text>
    <text x="55" y="774" class="metric">embedded raster: 49×55 px · grayscale coverage · no hinting</text>
    <text x="55" y="802" class="metric">shoulder run mean: 6.67px → 4.89px</text>
    <text x="55" y="828" class="metric">median: 6px → 4px · 9 sampled columns · threshold L&lt;128</text>
    <text x="360" y="745" class="label">R0 original</text>
    <image x="360" y="770" width="294" height="330" image-rendering="pixelated" href="data:image/png;base64,"/>
    <text x="780" y="745" class="label">R1 join-relief redraw</text>
    <image x="780" y="770" width="294" height="330" image-rendering="pixelated" href="data:image/png;base64,"/>
    
<line x1="55" y1="1050" x2="1225" y2="1050" class="rule"/>
<text x="55" y="1085" class="note">Finding: R1 reduces thresholded shoulder thickness by about 27–31%, but compact samples become markedly thinner; 14px median shoulder run falls from 2px to 1px.</text>
<text x="55" y="1112" class="note">Interpretation: an enlarged-outline correction can create a small-size failure. Compiled-font, hinting and target-renderer validation is still required before any optical-size decision.</text>
</svg>
