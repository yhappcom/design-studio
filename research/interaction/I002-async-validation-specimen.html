<!doctype html><html><meta charset="utf-8"><title>I002 Async Validation</title><style>body{font-family:system-ui;padding:24px;max-width:800px;margin:auto}.case{border:1px solid #aaa;padding:16px;margin:16px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{min-height:1.5em;margin-top:8px}button{min-height:44px}button[aria-disabled=true]{opacity:.65}progress{width:100%;margin-top:12px}</style><body>
<h1>I002 async validation specimen</h1>
<section class=case id=favCase aria-busy=false><h2>Optimistic reversible favorite</h2><div class=actions><button id=fav aria-pressed=false aria-disabled=false>Favorite</button><button id=favRetry hidden>Retry save</button></div><div id=favStatus class=status role=status aria-atomic=true></div></section>
<section class=case id=transferCase aria-busy=false><h2>High-consequence transfer</h2><div class=actions><button id=transfer aria-disabled=false>Submit transfer</button><button id=transferRetry hidden>Retry transfer</button><button id=check hidden>Check status</button></div><div id=transferStatus class=status role=status aria-atomic=true></div><div id=transferMeta></div></section>
<section class=case id=exportCase aria-busy=false><h2>Determinate export</h2><div class=actions><button id=exportBtn aria-disabled=false>Start export</button><button id=cancel hidden>Cancel export</button></div><progress id=progress max=100 value=0 aria-label="Export progress"></progress><div id=exportStatus class=status role=status aria-atomic=true></div></section>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let favReq=0, favPending=false, favValue=false;
async function saveFavorite(){if(favPending)return;const retryWasFocused=document.activeElement===favRetry;favPending=true;favReq++;favCase.setAttribute('aria-busy','true');fav.setAttribute('aria-disabled','true');favValue=true;fav.setAttribute('aria-pressed','true');fav.textContent='Favorited';favStatus.textContent='Saving favorite…';favRetry.hidden=true;await sleep(80);if(favReq===1){favValue=false;fav.setAttribute('aria-pressed','false');fav.textContent='Favorite';favStatus.textContent='Favorite was not saved.';favRetry.hidden=false}else{favStatus.textContent='Favorite saved.'}favPending=false;favCase.setAttribute('aria-busy','false');fav.setAttribute('aria-disabled','false');if(retryWasFocused)fav.focus()}
fav.addEventListener('click',saveFavorite);favRetry.addEventListener('click',saveFavorite);
let transferPending=false, transferCommitCount=0, transferOperationId=null, transferOutcome='idle';
async function submitTransfer(){if(transferPending||transferOutcome==='confirmed'||transferOutcome==='unknown')return;transferPending=true;transferOutcome='pending';transferOperationId='op-'+Math.random().toString(36).slice(2,9);transferCase.setAttribute('aria-busy','true');transfer.setAttribute('aria-disabled','true');transferStatus.textContent='Submitting transfer…';transferMeta.textContent='Operation '+transferOperationId;check.hidden=true;transferRetry.hidden=true;await sleep(80);/* server commits, response is lost */transferCommitCount++;transferPending=false;transferOutcome='unknown';transferCase.setAttribute('aria-busy','false');transfer.setAttribute('aria-disabled','true');transferStatus.textContent='We lost the response. Checking is required before any retry.';check.hidden=false}
transfer.addEventListener('click',submitTransfer);transferRetry.addEventListener('click',()=>{});
check.addEventListener('click',async()=>{const checkWasFocused=document.activeElement===check;check.setAttribute('aria-disabled','true');transferCase.setAttribute('aria-busy','true');transferStatus.textContent='Checking transfer status…';await sleep(60);transferOutcome='confirmed';transferCase.setAttribute('aria-busy','false');check.hidden=true;transfer.setAttribute('aria-disabled','true');transferStatus.textContent='Transfer confirmed.';if(checkWasFocused)transfer.focus()});
let exportTimer=null, exportRunning=false, exportGeneration=0;
function startExport(){if(exportRunning)return;exportRunning=true;const gen=++exportGeneration;exportCase.setAttribute('aria-busy','true');exportBtn.setAttribute('aria-disabled','true');cancel.hidden=false;progress.value=0;exportStatus.textContent='Exporting…';let p=0;exportTimer=setInterval(()=>{if(!exportRunning||gen!==exportGeneration)return;p+=25;progress.value=p;exportStatus.textContent=`Export ${p}% complete.`;if(p>=100){clearInterval(exportTimer);exportTimer=null;exportRunning=false;exportCase.setAttribute('aria-busy','false');exportBtn.setAttribute('aria-disabled','false');const cancelWasFocused=document.activeElement===cancel;cancel.hidden=true;exportStatus.textContent='Export complete.';if(cancelWasFocused)exportBtn.focus()}},40)}
exportBtn.addEventListener('click',startExport);cancel.addEventListener('click',()=>{if(!exportRunning)return;const cancelWasFocused=document.activeElement===cancel;exportRunning=false;exportGeneration++;if(exportTimer){clearInterval(exportTimer);exportTimer=null}exportCase.setAttribute('aria-busy','false');exportBtn.setAttribute('aria-disabled','false');cancel.hidden=true;exportStatus.textContent='Export canceled.';if(cancelWasFocused)exportBtn.focus()});
window.inspect=()=>({active:document.activeElement.id,favReq,favPending,favPressed:fav.getAttribute('aria-pressed'),favStatus:favStatus.textContent,favRetryHidden:favRetry.hidden,favBusy:favCase.getAttribute('aria-busy'),transferCommitCount,transferPending,transferOutcome,transferOperationId,transferRetryHidden:transferRetry.hidden,checkHidden:check.hidden,transferStatus:transferStatus.textContent,transferBusy:transferCase.getAttribute('aria-busy'),exportRunning,exportText:exportStatus.textContent,exportValue:progress.value,exportBusy:exportCase.getAttribute('aria-busy')});
</script></body></html>
