name: Type T021 R4E Proof
on:
  push:
    paths:
      - 'research/type/T021-r4e-full-family-integration-harness.py'
      - '.github/workflows/type-t021-r4e-proof.yml'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check fonttools pillow
      - name: Execute R4E integration proof
        run: python research/type/T021-r4e-full-family-integration-harness.py
      - name: Show result
        run: cat /tmp/t021-logmate-r4e/T021-r4e-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: t021-r4e-full-family-proof
          path: /tmp/t021-logmate-r4e/
          if-no-files-found: error
